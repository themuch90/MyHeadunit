[core]
cache_dir = /var/cache/mopidy
config_dir = /etc/mopidy
data_dir = /var/lib/mopidy

# API WebSocket/JSON-RPC su cui si collega l'app Flutter (RadioService),
# vedi lib/services/radio_service.dart. hostname 0.0.0.0: deve essere
# raggiungibile da fuori il container (network_mode: host, vedi compose.yaml).
[http]
enabled = true
hostname = 0.0.0.0
port = 6680

# Riproduce direttamente URL di stream (http/https), coprendo il caso d'uso
# della radio web senza bisogno di un'estensione dedicata per stazione.
[stream]
enabled = true

# Uscita audio diretta su ALSA: l'host non ha PulseAudio/PipeWire in
# esecuzione, solo il device ALSA reale (vedi /dev/snd, montato dal
# container in compose.yaml).
[audio]
output = alsasink

[mpd]
enabled = false

[m3u]
enabled = false

[local]
enabled = false
