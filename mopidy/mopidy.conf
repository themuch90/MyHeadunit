[core]
cache_dir = /var/cache/mopidy
config_dir = /etc/mopidy
data_dir = /var/lib/mopidy

[http]
enabled = true
hostname = 0.0.0.0
port = 6680

[stream]
enabled = true

# L'host non ha PulseAudio/PipeWire: uscita ALSA diretta.
[audio]
output = alsasink
mixer = alsamixer

[mpd]
enabled = false

[m3u]
enabled = false
